name: Godot validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          mv "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Import project and check the main scene
        shell: bash
        run: |
          set -euo pipefail
          run_godot_checked() {
            local output status=0
            if output="$("$@" 2>&1)"; then
              status=0
            else
              status=$?
            fi
            printf '%s\n' "$output"
            if grep -E "SCRIPT ERROR:|ERROR:|Parse Error:|Failed to load script" <<< "$output"; then
              return 1
            fi
            return "$status"
          }

          godot --version
          run_godot_checked godot --headless --editor --path . --quit
          run_godot_checked timeout 60s godot --headless --path . --quit-after 10

      - name: Run GDScript tests
        shell: bash
        run: |
          set -euo pipefail
          run_godot_checked() {
            local output status=0
            if output="$("$@" 2>&1)"; then
              status=0
            else
              status=$?
            fi
            printf '%s\n' "$output"
            if grep -E "SCRIPT ERROR:|ERROR:|Parse Error:|Failed to load script" <<< "$output"; then
              return 1
            fi
            return "$status"
          }

          run_godot_checked timeout 60s godot --headless --path . --script tests/test_mobile_controls.gd
          run_godot_checked timeout 60s godot --headless --path . --script tests/test_save_system.gd
          run_godot_checked timeout 60s godot --headless --path . --script tests/test_combat_rules.gd
